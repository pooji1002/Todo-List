<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do Motivation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('to do list.JPG') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }
    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 60px;
      height: 60px;
    }
    .content {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: brightness(1.05); 
      margin-left: 80px;
      padding-left: 100px;
    }
    .quote {
  font-size: 1.5em;
  font-weight: bold;
  margin-bottom: 20px;
  color: #444;
  background-color: rgba(255, 255, 255, 0.7);
  padding: 6px 12px;
  border-radius: 10px;
}

.suggestion {
  font-size: 1em;
  margin-bottom: 30px;
  background-color: rgba(255, 255, 255, 0.6);
  padding: 6px 12px;
  border-radius: 10px;
}

    .start-btn {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .start-btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <img src="logo.JPG" alt="Logo" class="logo" />
  <div class="content">
    <div class="quote">"The secret of getting ahead is getting started."</div>
    <div class="suggestion">Take control of your day — begin with a To-Do List!</div>
    <button class="start-btn" onclick="window.location.href='todo.html'">Start Using To-Do List</button>

  </div>
</body>
</html>
