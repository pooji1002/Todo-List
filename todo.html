<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do Motivation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="stats-container">
      <div class="details">
        <h1>ToDo List</h1>
        <p>Keep it Up!</p>
        <div id="ProgressBar">
          <div id="Progress"></div>
        </div> 
      </div>
      <div class="stats-numbers">
        <p id="numbers">0 / 0</p>
      </div>
    </div>
    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="Write your task" />
      <button id="newTask" type="submit">+</button>
    </form>
    <ul id="task-list" class="task-list"></ul>
  </div>

  <!-- Popup Modal -->
  <div id="popup" class="popup">
    <h2>🎉 Amazing job!</h2>
    <p>You've completed all your tasks!</p>
    <p> Keep up the great energy!</p>
    <button onclick="closePopup()">Add More Tasks</button>
  </div>
  

  <!-- Confetti script -->
  <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
